# /etc/nginx/http.d/close.conf

server {
    listen 10000;
    listen [::]:10000;

    server_name _;

    root /app/web;
    index close.html;

    # ========== 安全头 ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ========== 超时与缓冲区 ==========
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # ========== 健康检查接口 ==========
    location = /api/v1/health {
        limit_req zone=api_limit burst=20 nodelay;

        limit_except GET HEAD {
            deny all;
        }

        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"status": "ok"}';
    }

    # ========== 静态文件 ==========
    location / {
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ /close.html;

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ========== 模板目录禁止访问 ==========
    location ^~ /templates/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== 禁止访问敏感文件 ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|conf|bak|sql|ini|sh|git)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== 错误页 ==========
    # 说明：close.html 同时作为默认首页和错误页，因此不能加 internal
    location = /close.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 400 401 403 404 405 408 429 500 502 503 504 /close.html;

    # ========== 日志 ==========
    access_log /var/log/nginx/access_10000.log;
    error_log  /var/log/nginx/error_10000.log warn;
}
