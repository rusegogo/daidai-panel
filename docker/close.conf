# /etc/nginx/http.d/close.conf
# 本文件被 nginx.conf 的 http 块 include，因此：
#   - 文件内只能有 server {} 块；http 级指令（limit_req_zone、server_tokens 等）放 nginx.conf 的 http 块
#   - 全局性/有状态指令不要放片段，避免与其他片段重复定义报 zero size / duplicate

server {
    listen 10000;
    server_name _;

    root /app/web;
    index close.html;

    gzip on;
    # 健康接口是 JSON，close.html 是 text/html（默认已包含在 gzip_types 的隐含 html 里，无需单列）。
    # 注意：.ttf 要生效，取决于 mime.types 是否把它映射成 font/ttf；没映射上时是【静默不压缩】而非报错，
    # 排查先看响应头 Content-Type。这里没有字体产物，故不列 ttf，避免给人"已压缩"的错觉。
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 1m;

    # 禁止搜索引擎收录（关闭页/健康接口都不该被索引）。
    # nginx 继承陷阱：任一 location 内只要写了 add_header，就完全不再继承这里的 add_header。
    # 因此下面每个写了 add_header 的 location 都把这行原样重抄；漏抄不报错，只是该响应静默丢掉此头。
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========== 健康检查接口 ==========
    # 精确匹配，优先于静态资源正则。只允许 GET/HEAD。
    location = /api/v1/health {
        limit_except GET HEAD {
            deny all;
        }
        default_type application/json;
        # 注意：这里写了 add_header，故必须重抄 X-Robots-Tag 等（见上方说明）。
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"status": "ready for halt"}';
    }

    # ========== 默认首页 / SPA 回退 ==========
    location / {
        try_files $uri $uri/ /close.html;
        limit_except GET HEAD {
            deny all;
        }
    }

    # ========== 模板目录禁止访问 ==========
    location ^~ /templates/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== 禁止访问敏感文件 ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(env|log|conf|bak|sql|ini|sh|git)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== 静态资源缓存头 ==========
    # 借鉴点：正则 location 按书写顺序先中先用；两条都【不写 try_files】，
    # 文件不存在就是明确的 nginx 404，不会回退成 close.html 的一段 HTML。
    # Cache-Control 故意都不加 always：add_header 默认不作用于 404 等错误响应，
    # 缺失文件的 404 绝不能被标成可缓存/immutable。

    # 带内容哈希的产物：文件名随内容变，可放心长缓存。
    # 形态 <name>-<8位base64url哈希>.<ext>，用两个 (?=…) 排除"长得像单词/日期"的 8 位片段。
    # 正则含 { }，nginx 要求整条加引号；用区分大小写的 ~（否则 [A-Z] 会连小写一起匹配）。
    location ~ "^/assets/(?:[^/]+/)*[^/]+-(?=[A-Za-z0-9_-]{0,7}[A-Za-z])(?=[A-Za-z0-9_-]{0,7}[0-9_-]|[A-Za-z0-9_-]{1,7}[A-Z])[A-Za-z0-9_-]{8}\.(?:(?:js|mjs|css)(?:\.map)?|json|wasm|svg|png|jpe?g|gif|webp|avif|ico|ttf|otf|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 其余静态文件（不带哈希）：升级后同名换内容，只能 no-cache（可存，但每次带 ETag/Last-Modified 回源校验，没变即 304）。
    location ~* \.(js|mjs|css|map|json|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|otf|wasm)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ========== close.html 精确匹配（默认首页与错误页共用，不能加 internal） ==========
    location = /close.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 400 401 403 404 405 408 429 500 502 503 504 /close.html;
}
