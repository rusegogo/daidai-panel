# /etc/nginx/http.d/close.conf
# 现代化安全 Nginx 配置
# reder端口: 10000

# 隐藏 Nginx 版本号
server_tokens off;

# 定义限速区域（防止暴力请求）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 10000;

    server_name _;

    # ========== 安全头 ==========
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 禁止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;
    # 引用来源策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 内容安全策略（根据实际需求调整）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
    # 权限策略
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS（如果启用了 HTTPS，请取消注释；纯 HTTP 场景下不要启用）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ========== 超时与缓冲区安全 ==========
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # 限制 HTTP 方法
    # （在 location 中单独处理，允许 GET/HEAD/POST 等）

    # ========== 默认首页 ==========
    root /app/web;
    index close.html;

    # ========== 健康检查接口 ==========
    location = /api/v1/health {
        limit_req zone=api_limit burst=20 nodelay;

        # 只允许 GET 和 HEAD
        limit_except GET HEAD {
            deny all;
        }

        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"status": "ok"}';
    }

    # ========== 静态文件服务 ==========
    location / {
        # 仅允许 GET/HEAD
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ /close.html;

        # 静态资源缓存策略
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML 不缓存
        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ========== 禁止访问敏感文件 ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|conf|bak|sql|ini|sh|git)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== 错误页 ==========
    error_page 403 404 500 502 503 504 /close.html;
    location = /close.html {
        internal;
    }
